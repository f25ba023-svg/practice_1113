<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>反射神経ゲーム</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07111f;
      --panel: #111d2e;
      --text: #f8fafc;
      --muted: #a9b7ca;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.14), transparent 30rem),
        var(--bg);
    }
    .game { width: min(92vw, 680px); }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 5vw, 2rem);
    }
    .record { color: #fde68a; font-weight: 800; }
    .status {
      min-height: 84px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .status-card {
      padding: 10px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      background: rgba(17, 29, 46, 0.88);
    }
    .status-card span {
      display: block;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .status-card strong {
      display: block;
      margin-top: 4px;
      font-size: 1.12rem;
    }
    #game-area {
      width: 100%;
      height: min(58vh, 440px);
      min-height: 320px;
      border: 0;
      border-radius: 24px;
      color: white;
      font: 900 clamp(1.5rem, 6vw, 2.8rem) "Yu Gothic", "Meiryo", sans-serif;
      cursor: pointer;
      background: #263449;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.28);
      transition: background-color 120ms ease, transform 80ms ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      white-space: pre-line;
    }
    #game-area:active { transform: scale(0.985); }
    #game-area.waiting { background: #b91c1c; }
    #game-area.ready { background: #16a34a; }
    #game-area.result { background: #2563eb; }
    #game-area:focus-visible {
      outline: 4px solid #f8fafc;
      outline-offset: 4px;
    }
  </style>
</head>
<body>
  <main class="game">
    <div class="topbar">
      <h1>反射神経ゲーム</h1>
      <div class="record">ベスト：<span id="best-score">なし</span></div>
    </div>

    <div class="status" aria-live="polite">
      <div class="status-card"><span>ラウンド</span><strong id="round">- / 5</strong></div>
      <div class="status-card"><span>今回のタイム</span><strong id="time">- ms</strong></div>
      <div class="status-card"><span>平均</span><strong id="average">- ms</strong></div>
    </div>

    <button id="game-area" type="button">スタート！</button>
  </main>

  <script src="score.js"></script>
  <script src="reflex.js"></script>
</body>
</html>
